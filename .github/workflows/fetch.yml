name: Fetch BTC candles

# Tải dữ liệu OKX + phân tích + vẽ chart, đẩy kết quả lên nhánh `live`.
# Trong cửa sổ phiên (sáng VN, London, New York) scripts/live.py tự lặp mỗi 5 phút (~55 phút/lần chạy).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/fetch.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: fetch
  # push code mới thì hủy lượt đang lặp để áp dụng ngay; lịch/dispatch thì xếp hàng
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cài thư viện
        run: pip install -q -r requirements.txt
      - name: Tải dữ liệu + phân tích (lặp trong phiên)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/live.py
